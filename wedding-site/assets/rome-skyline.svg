    <g fill="#fbf6ec" opacity="0.55">
      <ellipse cx="930" cy="122" rx="9" ry="13"/><ellipse cx="962" cy="118" rx="9" ry="13"/>
      <ellipse cx="994" cy="116" rx="9" ry="13"/><ellipse cx="1026" cy="116" rx="9" ry="13"/>
      <ellipse cx="1058" cy="118" rx="9" ry="13"/><ellipse cx="1090" cy="122" rx="9" ry="13"/>
      <ellipse cx="930" cy="156" rx="9" ry="13"/><ellipse cx="962" cy="152" rx="9" ry="13"/>
      <ellipse cx="994" cy="150" rx="9" ry="13"/><ellipse cx="1026" cy="150" rx="9" ry="13"/>
      <ellipse cx="1058" cy="152" rx="9" ry="13"/><ellipse cx="1090" cy="156" rx="9" ry="13"/>
