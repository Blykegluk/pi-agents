<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 210" preserveAspectRatio="xMidYMax slice" fill="none">
  <defs>
    <filter id="soft" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
      <feGaussianBlur stdDeviation="1"/>
    </filter>
    <linearGradient id="cityFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eeb98a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#e3a06b" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="cityNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cf8a55" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#b9713d" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <g filter="url(#soft)">
