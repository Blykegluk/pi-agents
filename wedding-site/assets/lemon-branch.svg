<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 380" fill="none">
  <defs>
    <filter id="wc" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="9"/>
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
    <radialGradient id="lemon" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#f6d75c"/>
      <stop offset="55%" stop-color="#eebd3e"/>
      <stop offset="100%" stop-color="#d99a2b"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8a9a55"/>
      <stop offset="100%" stop-color="#5f7038"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8b46a"/>
      <stop offset="100%" stop-color="#77874a"/>
    </linearGradient>
  </defs>
  <g filter="url(#wc)">
    <!-- branches -->
    <path d="M-10 20 C 70 60, 130 110, 180 180 C 210 225, 235 265, 250 310" stroke="#7d6a3a" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <path d="M100 85 C 150 95, 200 90, 250 70" stroke="#7d6a3a" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M170 165 C 220 175, 275 170, 330 150" stroke="#7d6a3a" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M225 275 C 270 285, 315 280, 360 265" stroke="#7d6a3a" stroke-width="4" stroke-linecap="round" opacity="0.75"/>

    <!-- leaves -->
    <ellipse cx="120" cy="60" rx="46" ry="17" transform="rotate(-18 120 60)" fill="url(#leafA)" opacity="0.9"/>
    <ellipse cx="185" cy="105" rx="42" ry="15" transform="rotate(24 185 105)" fill="url(#leafB)" opacity="0.85"/>
    <ellipse cx="255" cy="60" rx="44" ry="16" transform="rotate(-10 255 60)" fill="url(#leafB)" opacity="0.85"/>
    <ellipse cx="150" cy="150" rx="40" ry="15" transform="rotate(-35 150 150)" fill="url(#leafA)" opacity="0.9"/>
    <ellipse cx="285" cy="135" rx="46" ry="16" transform="rotate(12 285 135)" fill="url(#leafA)" opacity="0.88"/>
    <ellipse cx="340" cy="170" rx="38" ry="14" transform="rotate(-14 340 170)" fill="url(#leafB)" opacity="0.8"/>
    <ellipse cx="215" cy="225" rx="42" ry="15" transform="rotate(40 215 225)" fill="url(#leafA)" opacity="0.85"/>
    <ellipse cx="300" cy="255" rx="44" ry="16" transform="rotate(8 300 255)" fill="url(#leafB)" opacity="0.85"/>
    <ellipse cx="255" cy="330" rx="40" ry="15" transform="rotate(28 255 330)" fill="url(#leafA)" opacity="0.8"/>
    <ellipse cx="360" cy="290" rx="36" ry="13" transform="rotate(-20 360 290)" fill="url(#leafB)" opacity="0.75"/>

    <!-- lemons -->
    <ellipse cx="215" cy="70" rx="30" ry="24" transform="rotate(-15 215 70)" fill="url(#lemon)"/>
    <ellipse cx="115" cy="115" rx="27" ry="22" transform="rotate(20 115 115)" fill="url(#lemon)"/>
    <ellipse cx="320" cy="105" rx="29" ry="23" transform="rotate(-8 320 105)" fill="url(#lemon)"/>
    <ellipse cx="250" cy="180" rx="31" ry="25" transform="rotate(12 250 180)" fill="url(#lemon)"/>
    <ellipse cx="180" cy="270" rx="28" ry="22" transform="rotate(-22 180 270)" fill="url(#lemon)"/>
    <ellipse cx="330" cy="310" rx="30" ry="24" transform="rotate(15 330 310)" fill="url(#lemon)"/>
    <!-- lemon tips -->
    <circle cx="238" cy="52" r="4" fill="#d99a2b" opacity="0.8"/>
    <circle cx="270" cy="198" r="4" fill="#d99a2b" opacity="0.8"/>
    <circle cx="352" cy="326" r="4" fill="#d99a2b" opacity="0.8"/>
  </g>
</svg>
