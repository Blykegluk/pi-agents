<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 480" fill="none">
  <defs>
    <filter id="wcE" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="4" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <filter id="wcS" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4"/>
      <feGaussianBlur stdDeviation="0.4"/>
    </filter>
    <radialGradient id="lem1" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f9e567"/>
      <stop offset="45%" stop-color="#f3cf3f"/>
      <stop offset="80%" stop-color="#e3ac28"/>
      <stop offset="100%" stop-color="#c98f1e"/>
    </radialGradient>
    <radialGradient id="lem2" cx="40%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#fbeb7e"/>
      <stop offset="50%" stop-color="#efc738"/>
      <stop offset="100%" stop-color="#cf9522"/>
    </radialGradient>
    <linearGradient id="lfDeep" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#50734f"/>
      <stop offset="55%" stop-color="#3a5a40"/>
      <stop offset="100%" stop-color="#2b4532"/>
    </linearGradient>
    <linearGradient id="lfMid" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#7d9a63"/>
      <stop offset="60%" stop-color="#5c7c4c"/>
      <stop offset="100%" stop-color="#43603b"/>
    </linearGradient>
    <linearGradient id="lfLight" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#a9bd85"/>
      <stop offset="60%" stop-color="#80a063"/>
      <stop offset="100%" stop-color="#5b7a4a"/>
    </linearGradient>

    <!-- gabarit feuille : base en (0,0), pointe en (70,0) -->
    <path id="leaf" d="M0 0 C 12 -18, 52 -23, 84 0 C 52 23, 12 18, 0 0 Z"/>
    <path id="vein" d="M5 0 C 28 -2, 55 -2, 76 0"/>
    <!-- gabarit fleur -->
    <g id="fleur">
      <g fill="#fdf9ef" stroke="#e4d3ba" stroke-width="1">
        <ellipse cx="0" cy="-10" rx="5" ry="9"/>
        <ellipse cx="9.5" cy="-3" rx="5" ry="9" transform="rotate(72 9.5 -3)"/>
        <ellipse cx="6" cy="8" rx="5" ry="9" transform="rotate(144 6 8)"/>
        <ellipse cx="-6" cy="8" rx="5" ry="9" transform="rotate(216 -6 8)"/>
        <ellipse cx="-9.5" cy="-3" rx="5" ry="9" transform="rotate(288 -9.5 -3)"/>
      </g>
      <circle cx="0" cy="0" r="3.2" fill="#eebd3e"/>
      <circle cx="-2.5" cy="-3" r="1.1" fill="#d99a2b"/>
      <circle cx="3" cy="-1.5" r="1.1" fill="#d99a2b"/>
    </g>
  </defs>

  <!-- ================= tiges ================= -->
  <g filter="url(#wcS)">
    <path d="M56 44 C 122 80, 178 134, 225 205 C 265 265, 295 330, 315 400" stroke="#77653c" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
    <path d="M120 92 C 180 100, 240 88, 300 66" stroke="#7c6a40" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M205 178 C 265 186, 330 176, 395 158" stroke="#7c6a40" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M270 300 C 330 308, 395 300, 455 288" stroke="#7c6a40" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <path d="M300 372 C 345 388, 390 396, 440 396" stroke="#7c6a40" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    <!-- pédoncules des citrons -->
    <path d="M175 108 C 165 116, 155 122, 148 126" stroke="#7c6a40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M282 70 C 288 76, 294 82, 298 88" stroke="#7c6a40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M370 164 C 378 174, 386 186, 392 196" stroke="#7c6a40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M238 214 C 240 232, 242 252, 244 270" stroke="#7c6a40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M300 340 C 292 348, 284 356, 278 362" stroke="#7c6a40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M440 350 C 446 362, 452 374, 456 384" stroke="#7c6a40" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- ================= feuilles (attachées aux tiges) ================= -->
  <g filter="url(#wcE)">
    <!-- le long de la tige principale -->
    <g transform="translate(84 58) rotate(-28) scale(0.72)"><use href="#leaf" fill="url(#lfLight)" opacity="0.95"/><use href="#vein" stroke="#2c4433" stroke-width="1.5" opacity="0.55"/></g>
    <g transform="translate(108 76) rotate(96) scale(0.68)"><use href="#leaf" fill="url(#lfLight)" opacity="0.92"/><use href="#vein" stroke="#2c4433" stroke-width="1.5" opacity="0.5"/></g>
    <g transform="translate(196 158) rotate(-35) scale(0.95)"><use href="#leaf" fill="url(#lfDeep)" opacity="0.93"/><use href="#vein" stroke="#243c2b" stroke-width="1.5" opacity="0.55"/></g>
    <g transform="translate(228 220) rotate(115) scale(0.9)"><use href="#leaf" fill="url(#lfMid)" opacity="0.9"/><use href="#vein" stroke="#2c4433" stroke-width="1.5" opacity="0.5"/></g>
    <g transform="translate(292 320) rotate(-160) scale(0.85)"><use href="#leaf" fill="url(#lfLight)" opacity="0.88"/><use href="#vein" stroke="#3c5a41" stroke-width="1.4" opacity="0.5"/></g>

    <!-- rameau haut -->
    <g transform="translate(150 88) rotate(-58)"><use href="#leaf" fill="url(#lfMid)" opacity="0.92"/><use href="#vein" stroke="#2c4433" stroke-width="1.5" opacity="0.5"/></g>
    <g transform="translate(205 82) rotate(38) scale(0.9)"><use href="#leaf" fill="url(#lfDeep)" opacity="0.93"/><use href="#vein" stroke="#243c2b" stroke-width="1.5" opacity="0.55"/></g>
    <g transform="translate(252 74) rotate(-30) scale(0.95)"><use href="#leaf" fill="url(#lfLight)" opacity="0.9"/><use href="#vein" stroke="#3c5a41" stroke-width="1.4" opacity="0.5"/></g>
    <g transform="translate(298 66) rotate(-8) scale(0.8)"><use href="#leaf" fill="url(#lfMid)" opacity="0.9"/><use href="#vein" stroke="#2c4433" stroke-width="1.4" opacity="0.5"/></g>

    <!-- rameau milieu -->
    <g transform="translate(245 180) rotate(-48)"><use href="#leaf" fill="url(#lfDeep)" opacity="0.94"/><use href="#vein" stroke="#243c2b" stroke-width="1.5" opacity="0.55"/></g>
    <g transform="translate(300 172) rotate(35) scale(0.9)"><use href="#leaf" fill="url(#lfMid)" opacity="0.9"/><use href="#vein" stroke="#2c4433" stroke-width="1.5" opacity="0.5"/></g>
    <g transform="translate(348 166) rotate(-28) scale(0.9)"><use href="#leaf" fill="url(#lfDeep)" opacity="0.92"/><use href="#vein" stroke="#243c2b" stroke-width="1.5" opacity="0.55"/></g>
    <g transform="translate(392 158) rotate(-2) scale(0.8)"><use href="#leaf" fill="url(#lfLight)" opacity="0.88"/><use href="#vein" stroke="#3c5a41" stroke-width="1.4" opacity="0.5"/></g>

    <!-- rameau bas -->
    <g transform="translate(315 304) rotate(-42) scale(0.95)"><use href="#leaf" fill="url(#lfMid)" opacity="0.92"/><use href="#vein" stroke="#2c4433" stroke-width="1.5" opacity="0.5"/></g>
    <g transform="translate(368 300) rotate(32) scale(0.85)"><use href="#leaf" fill="url(#lfDeep)" opacity="0.9"/><use href="#vein" stroke="#243c2b" stroke-width="1.4" opacity="0.55"/></g>
    <g transform="translate(428 292) rotate(-18) scale(0.85)"><use href="#leaf" fill="url(#lfLight)" opacity="0.88"/><use href="#vein" stroke="#3c5a41" stroke-width="1.4" opacity="0.5"/></g>

    <!-- rameau du bas -->
    <g transform="translate(345 384) rotate(35) scale(0.8)"><use href="#leaf" fill="url(#lfMid)" opacity="0.88"/><use href="#vein" stroke="#2c4433" stroke-width="1.4" opacity="0.5"/></g>
    <g transform="translate(395 392) rotate(-22) scale(0.85)"><use href="#leaf" fill="url(#lfDeep)" opacity="0.9"/><use href="#vein" stroke="#243c2b" stroke-width="1.4" opacity="0.55"/></g>
  </g>

  <!-- ================= citrons ================= -->
  <g filter="url(#wcE)">
    <path d="M252 92 C 240 74, 258 56, 286 56 C 320 56, 348 76, 350 102 C 352 126, 330 142, 300 142 C 268 142, 244 122, 252 92 Z" fill="url(#lem1)"/>
    <path d="M100 132 C 88 116, 102 98, 128 96 C 158 94, 186 110, 190 134 C 194 156, 174 172, 146 172 C 118 172, 92 156, 100 132 Z" fill="url(#lem2)"/>
    <path d="M352 210 C 342 192, 358 174, 386 174 C 418 174, 446 194, 448 220 C 450 244, 428 260, 398 260 C 366 260, 342 238, 352 210 Z" fill="url(#lem1)"/>
    <!-- grappe de deux -->
    <path d="M196 290 C 184 272, 200 254, 228 254 C 262 254, 290 274, 292 300 C 294 324, 272 340, 242 340 C 210 340, 186 318, 196 290 Z" fill="url(#lem2)"/>
    <path d="M240 356 C 230 340, 244 324, 270 324 C 300 324, 326 342, 328 366 C 330 388, 310 402, 282 402 C 254 402, 232 382, 240 356 Z" fill="url(#lem1)"/>
    <path d="M428 396 C 418 380, 432 364, 458 364 C 486 364, 510 382, 512 404 C 514 426, 494 440, 468 440 C 442 440, 420 420, 428 396 Z" fill="url(#lem2)"/>

    <!-- pointes -->
    <g fill="#c98f1e" opacity="0.85">
      <ellipse cx="349" cy="104" rx="6" ry="4.5" transform="rotate(30 349 104)"/>
      <ellipse cx="190" cy="138" rx="5.5" ry="4" transform="rotate(25 190 138)"/>
      <ellipse cx="447" cy="224" rx="6" ry="4.5" transform="rotate(28 447 224)"/>
      <ellipse cx="291" cy="304" rx="6" ry="4.5" transform="rotate(28 291 304)"/>
      <ellipse cx="327" cy="370" rx="5.5" ry="4" transform="rotate(26 327 370)"/>
      <ellipse cx="511" cy="406" rx="5" ry="4" transform="rotate(25 511 406)"/>
    </g>
    <!-- reflets -->
    <g fill="#fdf3a1" opacity="0.65">
      <ellipse cx="278" cy="80" rx="16" ry="9" transform="rotate(-20 278 80)"/>
      <ellipse cx="124" cy="116" rx="13" ry="8" transform="rotate(-18 124 116)"/>
      <ellipse cx="378" cy="196" rx="15" ry="9" transform="rotate(-20 378 196)"/>
      <ellipse cx="222" cy="276" rx="14" ry="8" transform="rotate(-18 222 276)"/>
      <ellipse cx="262" cy="344" rx="12" ry="7" transform="rotate(-18 262 344)"/>
      <ellipse cx="452" cy="384" rx="11" ry="7" transform="rotate(-18 452 384)"/>
    </g>
  </g>

  <!-- ================= fleurs ================= -->
  <g filter="url(#wcE)">
    <use href="#fleur" transform="translate(212 120)"/>
    <use href="#fleur" transform="translate(415 148) scale(0.85)"/>
    <use href="#fleur" transform="translate(310 262) scale(0.75) rotate(20)"/>
  </g>
</svg>
